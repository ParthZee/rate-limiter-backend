name: Node.js Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci

      # Other algorithms commented out to prevent middleware interference.
      - name: Run Fixed Window Algorithm Tests
        run: npm run test:fixed

      # - name: Run Token Bucket Algorithm Tests
      #   run: npm run test:token

      # - name: Run Sliding Window Log Algorithm Tests
      #   run: npm run test:sliding
